[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "problem-specific-heuristic"
version = "0.1.0"
description = "MinVola replication lab with classical, quantum simulation and AI comparisons"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.3.5", "pandas==2.2.3", "scipy==1.17.0", "scikit-learn==1.8.0",
  "fastapi==0.143.0", "uvicorn==0.54.0", "sqlalchemy==2.1.4", "psycopg[binary]==3.3.6",
  "python-multipart==0.0.32", "httpx==0.28.1", "python-dotenv==1.2.4",
  "streamlit==1.65.0", "joblib==1.5.3", "matplotlib==3.10.8"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "nbformat==5.11.1", "nbclient==0.11.0", "ipykernel==7.4.0"]
market = ["yfinance>=0.2.66,<1"]
quantum = ["dwave-system>=1.36,<2", "qiskit>=2,<3"]

[tool.setuptools.packages.find]
include = ["psh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
